<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEADSPACE PICNIC</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0a0a0a; font-family: 'Courier New', monospace; color: #fff; }
  #game { width: 100vw; height: 100vh; position: relative; display: flex; flex-direction: column; }
  #scene { flex: 1; position: relative; overflow: hidden; background: #000; display: flex; align-items: center; justify-content: center; }
  #bg { position: absolute; inset: 0; background-size: cover; background-position: center; transition: background 1s; z-index: 1; }
  #ui { height: 240px; background: #111; border-top: 4px solid #333; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; z-index: 5; }
  #top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  #namebox { display: inline-block; background: #2a2a2a; color: #ffd700; padding: 4px 14px; font-weight: bold; font-size: 15px; border-radius: 6px; margin-bottom: 8px; border: 2px solid #444; text-transform: uppercase; letter-spacing: 1px; }
  #friendship { font-size: 14px; color: #ffd700; font-weight: bold; background: #2a2a2a; padding: 4px 12px; border: 2px solid #ffd700; border-radius: 6px; }
  #text { font-size: 20px; line-height: 1.7; min-height: 110px; white-space: pre-wrap; overflow-y: auto; }
  #continue { position: absolute; bottom: 18px; right: 22px; font-size: 13px; color: #ffd700; font-weight: bold; cursor: pointer; opacity: 0.7; animation: blink 1s infinite; user-select: none; }
  @keyframes blink { 50% { opacity: 0.2; } }
  #portrait { position: absolute; bottom: 0; right: 0; width: 300px; height: 300px; display: flex; align-items: flex-end; justify-content: center; z-index: 4; transition: all 0.4s; overflow: hidden; }
  .portrait-img { width: 260px; height: 260px; border: 5px solid #444; box-shadow: 0 0 25px rgba(0,0,0,0.9); display: block; background-size: auto; background-repeat: no-repeat; }
  #emotion { position: absolute; top: 16px; left: 16px; font-size: 12px; padding: 4px 10px; background: rgba(0,0,0,0.6); border: 1px solid #555; border-radius: 12px; pointer-events: none; z-index: 6; }
  .emotion-happy { color: #ffd700; border-color: #ffd700; }
  .emotion-sad { color: #a0a0ff; border-color: #a0a0ff; }
  .emotion-angry { color: #ff6b6b; border-color: #ff6b6b; }
  .emotion-neutral { color: #888; border-color: #666; }
  .fade { animation: fadeIn 0.5s ease-in; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .hidden { display: none !important; }
  .typewriter { border-right: 3px solid #fff; animation: blinkCursor 1s infinite; }
  @keyframes blinkCursor { 50% { border-color: transparent; } }
  #end-screen { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 20; text-align: center; }
  #end-screen h1 { font-size: 56px; margin-bottom: 24px; color: #ffd700; letter-spacing: 3px; }
  #end-screen p { font-size: 22px; max-width: 700px; line-height: 1.8; margin-bottom: 30px; color: #eee; }
  #friendship-final { font-size: 18px; color: #a0a0ff; margin-bottom: 30px; }
  #restart-btn { padding: 16px 40px; font-size: 20px; background: #2a2a2a; color: #ffd700; border: 3px solid #ffd700; cursor: pointer; font-family: inherit; font-weight: bold; text-transform: uppercase; letter-spacing: 3px; transition: 0.2s; }
  #restart-btn:hover { background: #ffd700; color: #000; }
  .argue-flash { animation: argueFlash 0.4s; }
  @keyframes argueFlash { 0%,100% { filter: none; } 50% { filter: hue-rotate(90deg) brightness(1.3); } }
</style>
</head>
<body>
<div id="game">
  <div id="scene">
    <div id="bg" class="bg-forest"></div>
    <div id="portrait"><div id="portrait-img" class="portrait-img"></div></div>
    <div id="emotion" class="emotion-neutral">NEUTRAL</div>
    <div id="continue">PRESS ENTER</div>
  </div>
  <div id="ui">
    <div id="top-bar">
      <div id="namebox" class="namebox">OMORI</div>
      <div id="friendship">FRIENDSHIP: 0</div>
    </div>
    <div id="text"></div>
  </div>
  <div id="end-screen">
    <h1 id="end-title">...?</h1>
    <div id="friendship-final"></div>
    <p id="end-text"></p>
    <button id="restart-btn">RESTART</button>
  </div>
</div>
<script>
const COLORS = {
  OMORI: '#666666',
  MARI: '#ffd700',
  KEL: '#4fc3f7',
  AUBREY: '#ff80ab',
  HERO: '#ffb74d',
  BASIL: '#aed581'
};

const PORTRAITS = {
  OMORI: null,
  MARI: {
    neutral: 'MARI/MARI SMILE.png',
    happy: 'MARI/MARI BIG SMILE.png',
    sad: 'MARI/MARI SMILE.png',
    angry: 'MARI/MARI SMIRK.png'
  },
  KEL: {
    neutral: 'KEL/KEL SWEAT.png',
    happy: 'KEL/KEL DETERMINED.png',
    sad: 'KEL/KEL SAD.png',
    angry: 'KEL/KEL SUPER ANGRY.png'
  },
  AUBREY: {
    neutral: 'AUBREY/AUBREY NEUTRAL.png',
    happy: 'AUBREY/AUBREYHAPPY.png',
    sad: 'AUBREY/AUBREY SAD.png',
    angry: 'AUBREY/AUBREY ANGRY.png'
  },
  HERO: {
    neutral: 'HERO/HERO NEUTRAL.png',
    happy: 'HERO/HERO HAPPY.png',
    sad: 'HERO/HERO SAD.png',
    angry: 'HERO/HERO SURPRISED.png'
  },
  BASIL: {
    neutral: 'BASIL/BASIL SLIGHT SMILE.png',
    happy: 'BASIL/BASIL SLIGHT SMILE.png',
    sad: 'BASIL/BASIL SCARED.png',
    angry: 'BASIL/BASIL ANGRY.png'
  },
  BLANK: null
};

const BG = {
  FOREST: 'linear-gradient(#2d5a27 0%, #1a3a1a 100%)',
  WHITE: 'radial-gradient(circle at center, #ffffff 0%, #e0e0e0 40%, #c0c0c0 100%)',
  KITCHEN: 'linear-gradient(#f5e6d3 0%, #e8d5c0 100%)',
  VOID: 'radial-gradient(circle at center, #1a1a1a 0%, #000000 100%)'
};

let friendship = 0;

const DIALOGUE = [
  { speaker: 'KEL', text: "Alright, team! Picnic time! Hero, did you bring the spaghetti?", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.KEL, friendship: +1 },
  { speaker: 'HERO', text: "I did. I also brought extra garlic bread, just in case Aubrey decides to eat her feelings again.", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.HERO, friendship: 0 },
  { speaker: 'AUBREY', text: "I don't eat my feelings, I eat spaghetti. There's a difference.", emotion: 'angry', bg: BG.FOREST, portrait: PORTRAITS.AUBREY, friendship: -1 },
  { speaker: 'KEL', text: "Sure you don't, Aubrey. Sure you don't.", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.KEL, friendship: -1 },
  { speaker: 'AUBREY', text: "Shut up, Kel! I can eat whatever I want!", emotion: 'angry', bg: BG.FOREST, portrait: PORTRAITS.AUBREY_BATTLE, friendship: -2, argue: true },
  { speaker: 'KEL', text: "Make me!", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.KEL_BATTLE, friendship: -2, argue: true },
  { speaker: 'HERO', text: "Guys... please...", emotion: 'sad', bg: BG.FOREST, portrait: PORTRAITS.HERO, friendship: +1 },
  { speaker: 'BASIL', text: "I brought... um... some flowers. For the table. If that's okay.", emotion: 'sad', bg: BG.FOREST, portrait: PORTRAITS.BASIL, friendship: +2 },
  { speaker: 'KEL', text: "Always okay, Basil! You know Mari would love flowers.", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.KEL, friendship: +1 },
  { speaker: 'AUBREY', text: "Flowers are gonna die anyway. Just like everything else.", emotion: 'angry', bg: BG.FOREST, portrait: PORTRAITS.AUBREY, friendship: -1 },
  { speaker: 'MARI', text: "I would. Thank you, Basil.", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.MARI, friendship: +2 },
  { speaker: 'HERO', text: "She would. Always did.", emotion: 'sad', bg: BG.FOREST, portrait: PORTRAITS.HERO, friendship: +1 },
  { speaker: 'AUBREY', text: "Can we please stop acting like she's gonna walk out of the woods and join us? It's creepy.", emotion: 'angry', bg: BG.FOREST, portrait: PORTRAITS.AUBREY, friendship: -2 },
  { speaker: 'KEL', text: "Aubrey! She's right here, in spirit! And in our hearts! And in that photo album Basil keeps showing everyone.", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.KEL, friendship: +1 },
  { speaker: 'AUBREY', text: "That's exactly what's creepy, Kel.", emotion: 'angry', bg: BG.FOREST, portrait: PORTRAITS.AUBREY, friendship: -1 },
  { speaker: 'KEL', text: "You're just grumpy because you didn't get garlic bread.", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.KEL, friendship: -1 },
  { speaker: 'AUBREY', text: "I HATE YOU.", emotion: 'angry', bg: BG.FOREST, portrait: PORTRAITS.AUBREY_BATTLE, friendship: -3, argue: true },
  { speaker: 'KEL', text: "I hate you too!", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.KEL_BATTLE, friendship: -3, argue: true },
  { speaker: 'HERO', text: "You two don't hate each other. You're just... loud.", emotion: 'neutral', bg: BG.FOREST, portrait: PORTRAITS.HERO, friendship: +1 },
  { speaker: 'BASIL', text: "I just... I like taking pictures. So we don't forget.", emotion: 'sad', bg: BG.FOREST, portrait: PORTRAITS.BASIL, friendship: +1 },
  { speaker: 'OMORI', text: "...", emotion: 'neutral', bg: BG.FOREST, portrait: PORTRAITS.OMORI, friendship: 0 },
  { speaker: 'HERO', text: "Omori? You okay, buddy? You've been real quiet.", emotion: 'neutral', bg: BG.FOREST, portrait: PORTRAITS.HERO, friendship: +1 },
  { speaker: 'KEL', text: "He's always quiet! That's Omori! Strong, silent, mysterious!", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.KEL, friendship: +1 },
  { speaker: 'AUBREY', text: "He's weird. That's what he is.", emotion: 'angry', bg: BG.FOREST, portrait: PORTRAITS.AUBREY, friendship: -1 },
  { speaker: 'MARI', text: "He's not weird. He's just... listening.", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.MARI, friendship: +2 },
  { speaker: 'KEL', text: "So! Who wants seconds? I made a deal with the forest spirits—", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.KEL, friendship: +1 },
  { speaker: 'HERO', text: "Kel, you didn't make a deal with anything.", emotion: 'neutral', bg: BG.FOREST, portrait: PORTRAITS.HERO, friendship: 0 },
  { speaker: 'KEL', text: "I traded them a shiny rock for eternal happiness! It's basically a contract.", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.KEL, friendship: +1 },
  { speaker: 'AUBREY', text: "You traded them a pebble you found near the junkyard.", emotion: 'angry', bg: BG.FOREST, portrait: PORTRAITS.AUBREY, friendship: -1 },
  { speaker: 'KEL', text: "It was a very special pebble!", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.KEL, friendship: +1 },
  { speaker: 'AUBREY', text: "It was a rock, Kel. A dumb rock.", emotion: 'angry', bg: BG.FOREST, portrait: PORTRAITS.AUBREY, friendship: -1 },
  { speaker: 'BASIL', text: "The flowers... they're wilting again. Just like last time.", emotion: 'sad', bg: BG.FOREST, portrait: PORTRAITS.BASIL_DARK, friendship: -1 },
  { speaker: 'HERO', text: "Basil, it's fine. They're probably just... tired.", emotion: 'neutral', bg: BG.FOREST, portrait: PORTRAITS.HERO, friendship: +1 },
  { speaker: 'BASIL', text: "They're not tired. They're dying. Everything's dying. Even the happy things.", emotion: 'sad', bg: BG.FOREST, portrait: PORTRAITS.BASIL_DARK, friendship: -2 },
  { speaker: 'MARI', text: "Basil... take a picture. Before it's gone.", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.MARI, friendship: +2 },
  { speaker: 'BASIL', text: "I already did. I have hundreds. But they don't... they don't move anymore. They don't smile when I look back.", emotion: 'sad', bg: BG.FOREST, portrait: PORTRAITS.BASIL, friendship: -1 },
  { speaker: 'AUBREY', text: "Ugh. Can we talk about something else? Please? Something not depressing?", emotion: 'angry', bg: BG.FOREST, portrait: PORTRAITS.AUBREY, friendship: -1 },
  { speaker: 'KEL', text: "Like what?", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.KEL, friendship: 0 },
  { speaker: 'AUBREY', text: "I don't know! Like... how Omori never says anything. Like how he just stares at us like we're made of glass.", emotion: 'angry', bg: BG.FOREST, portrait: PORTRAITS.AUBREY, friendship: -1 },
  { speaker: 'OMORI', text: "...", emotion: 'neutral', bg: BG.FOREST, portrait: PORTRAITS.OMORI, friendship: 0 },
  { speaker: 'KEL', text: "He's not staring! He's... thinking! Deeply!", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.KEL, friendship: +1 },
  { speaker: 'AUBREY', text: "About what? The void under his bed? The knife in the drawer?", emotion: 'angry', bg: BG.FOREST, portrait: PORTRAITS.AUBREY_BATTLE, friendship: -2 },
  { speaker: 'HERO', text: "Aubrey, stop it.", emotion: 'angry', bg: BG.FOREST, portrait: PORTRAITS.HERO_BATTLE, friendship: -1 },
  { speaker: 'KEL', text: "Haha! Good one, Aubrey! You're so funny! Remember that time we all went to the bakery and Mari got flour on her nose?", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.KEL, friendship: +2 },
  { speaker: 'MARI', text: "I did! And Hero tried to wipe it off but he got it on his cheek instead.", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.MARI, friendship: +2 },
  { speaker: 'HERO', text: "I remember. You laughed for ten minutes.", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.HERO, friendship: +2 },
  { speaker: 'AUBREY', text: "That was years ago.", emotion: 'angry', bg: BG.FOREST, portrait: PORTRAITS.AUBREY, friendship: -1 },
  { speaker: 'KEL', text: "It was yesterday! Time's weird in Headspace! Everything's yesterday and tomorrow at once!", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.KEL, friendship: +1 },
  { speaker: 'AUBREY', text: "Nothing's ever yesterday in Headspace if you don't let it be.", emotion: 'angry', bg: BG.FOREST, portrait: PORTRAITS.AUBREY, friendship: -1 },
  { speaker: 'BASIL', text: "Except here it's never tomorrow.", emotion: 'sad', bg: BG.FOREST, portrait: PORTRAITS.BASIL_DARK, friendship: -1 },
  { speaker: 'KEL', text: "Stop it. Just stop. We're happy here. We're together. That's all that matters.", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.KEL, friendship: +2 },
  { speaker: 'AUBREY', text: "We're not together if half of us are pretending the other half is dead.", emotion: 'angry', bg: BG.FOREST, portrait: PORTRAITS.AUBREY_BATTLE, friendship: -2 },
  { speaker: 'HERO', text: "Kel...", emotion: 'sad', bg: BG.FOREST, portrait: PORTRAITS.HERO, friendship: 0 },
  { speaker: 'KEL', text: "No! It IS all that matters! As long as we're together, nothing bad can happen! Right, Omori? Right, Mari?", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.KEL, friendship: +1 },
  { speaker: 'AUBREY', text: "No it's not. None of this is okay. We're sitting on a picnic blanket in a forest made of paper and pretending our dead friend is gonna show up with lemonade.", emotion: 'angry', bg: BG.FOREST, portrait: PORTRAITS.AUBREY_BATTLE, friendship: -3 },
  { speaker: 'MARI', text: "I'm not dead, Aubrey. I'm right here.", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.MARI, friendship: +1 },
  { speaker: 'AUBREY', text: "No you're not. You're not here. You're gone. And Omori—Omori knows. He knows what happened.", emotion: 'angry', bg: BG.FOREST, portrait: PORTRAITS.AUBREY_BATTLE, friendship: -2 },
  { speaker: 'OMORI', text: "...", emotion: 'neutral', bg: BG.FOREST, portrait: PORTRAITS.OMORI, friendship: 0 },
  { speaker: 'KEL', text: "Stop lying, Aubrey! Mari's right here! You can't just say she's gone!", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.KEL_BATTLE, friendship: -1, argue: true },
  { speaker: 'AUBREY', text: "I'm not lying! She's DEAD, Kel! DEAD!", emotion: 'angry', bg: BG.FOREST, portrait: PORTRAITS.AUBREY_BATTLE, friendship: -4, argue: true },
  { speaker: 'HERO', text: "Aubrey, that's enough!", emotion: 'angry', bg: BG.FOREST, portrait: PORTRAITS.HERO_BATTLE, friendship: -1 },
  { speaker: 'AUBREY', text: "No! Someone has to say it!", emotion: 'angry', bg: BG.FOREST, portrait: PORTRAITS.AUBREY_BATTLE, friendship: -2 },
  { speaker: 'HERO', text: "We should go back. Before it gets dark. Before the forest... changes.", emotion: 'neutral', bg: BG.FOREST, portrait: PORTRAITS.HERO, friendship: +1 },
  { speaker: 'BASIL', text: "If I take a picture now... will you be in it? All of you? Even Mari?", emotion: 'sad', bg: BG.FOREST, portrait: PORTRAITS.BASIL, friendship: +1 },
  { speaker: 'MARI', text: "Only if you remember to develop it.", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.MARI, friendship: +2 },
  { speaker: 'KEL', text: "...I miss her.", emotion: 'happy', bg: BG.FOREST, portrait: PORTRAITS.KEL, friendship: +2 },
  { speaker: 'HERO', text: "We all do.", emotion: 'sad', bg: BG.FOREST, portrait: PORTRAITS.HERO, friendship: +2 },
  { speaker: 'AUBREY', text: "I miss her too. I just... I didn't know how to say it without breaking.", emotion: 'angry', bg: BG.FOREST, portrait: PORTRAITS.AUBREY, friendship: +1 },
  { speaker: 'BASIL', text: "Then don't say it. Just... take the picture.", emotion: 'sad', bg: BG.FOREST, portrait: PORTRAITS.BASIL, friendship: +2 },
  { speaker: 'OMORI', text: "...", emotion: 'neutral', bg: BG.FOREST, portrait: PORTRAITS.OMORI, friendship: 0 },
  { speaker: null, text: "The shutter clicks. The sound is too loud. Too final.", emotion: 'neutral', bg: BG.VOID, portrait: PORTRAITS.BLANK, friendship: 0 },
  { speaker: null, text: "Blackout.", emotion: 'neutral', bg: BG.VOID, portrait: PORTRAITS.BLANK, friendship: 0 }
];

let idx = 0;
const bgEl = document.getElementById('bg');
const portraitImg = document.getElementById('portrait-img');
const portraitWrap = document.getElementById('portrait');
const namebox = document.getElementById('namebox');
const friendshipEl = document.getElementById('friendship');
const textEl = document.getElementById('text');
const emotionEl = document.getElementById('emotion');
const continueEl = document.getElementById('continue');
const endScreen = document.getElementById('end-screen');
const endTitle = document.getElementById('end-title');
const friendshipFinal = document.getElementById('friendship-final');
const endText = document.getElementById('end-text');
const restartBtn = document.getElementById('restart-btn');

function updateFriendship(change) {
  friendship += change;
  if (friendship < 0) friendship = 0;
  friendshipEl.textContent = 'FRIENDSHIP: ' + friendship;
}

function showDialogue(i) {
  if (i >= DIALOGUE.length) {
    endScreen.style.display = 'flex';
    endTitle.textContent = 'END';
    friendshipFinal.textContent = 'FINAL FRIENDSHIP: ' + friendship;
    endText.textContent = 'The picnic is over. Everyone went home. Or somewhere else. Omori stayed silent, as always.';
    return;
  }
  const d = DIALOGUE[i];
  bgEl.style.background = d.bg || BG.FOREST;
  if (d.argue) {
    bgEl.classList.add('argue-flash');
    setTimeout(() => bgEl.classList.remove('argue-flash'), 400);
  }
  portraitWrap.style.opacity = d.portrait ? '1' : '0';
  let imgSrc = null;
  if (d.speaker && PORTRAITS[d.speaker]) {
    const char = PORTRAITS[d.speaker];
    imgSrc = char[d.emotion] || char.neutral || null;
  } else if (d.portrait && PORTRAITS[d.portrait]) {
    imgSrc = PORTRAITS[d.portrait];
  }
  if (imgSrc) {
    portraitImg.style.backgroundImage = `url('${imgSrc}')`;
    portraitImg.style.backgroundSize = 'cover';
    portraitImg.style.backgroundPosition = 'center';
    portraitImg.style.backgroundRepeat = 'no-repeat';
  } else {
    portraitImg.style.backgroundImage = 'none';
  }
  if (d.speaker) {
    namebox.textContent = d.speaker;
    namebox.style.color = COLORS[d.speaker] || '#fff';
    namebox.style.borderColor = COLORS[d.speaker] || '#444';
    namebox.style.display = 'inline-block';
  } else {
    namebox.style.display = 'none';
  }
  emotionEl.className = `emotion-${d.emotion || 'neutral'}`;
  emotionEl.textContent = (d.emotion || 'neutral').toUpperCase();
  textEl.textContent = '';
  textEl.classList.remove('typewriter');
  void textEl.offsetWidth;
  textEl.classList.add('typewriter');
  continueEl.style.opacity = '0';
  if (d.friendship !== undefined) {
    updateFriendship(d.friendship);
  }
  const textSfx = document.getElementById('textSfx');
  textSfx.currentTime = 0;
  textSfx.play().catch(() => {});
  typeText(d.text, () => {
    continueEl.style.opacity = '0.7';
  });
}

let typeInterval = null;

function stopTyping() {
  if (typeInterval) {
    clearInterval(typeInterval);
    typeInterval = null;
  }
}

function playTextSfx() {
  const textSfx = document.getElementById('textSfx');
  textSfx.volume = 0.25;
  textSfx.currentTime = 0;
  textSfx.play().catch(() => {});
}

function typeText(text, callback) {
  stopTyping();
  textEl.textContent = '';
  let i = 0;
  typeInterval = setInterval(() => {
    textEl.textContent += text.charAt(i);
    playTextSfx();
    i++;
    if (i >= text.length) {
      clearInterval(typeInterval);
      typeInterval = null;
      if (callback) callback();
    }
  }, 35);
}

function next() {
  const d = DIALOGUE[idx];
  stopTyping();
  if (textEl.textContent !== d.text) {
    textEl.textContent = d.text;
    textEl.classList.remove('typewriter');
    continueEl.style.opacity = '0.7';
    playTextSfx();
    return;
  }
  idx++;
  showDialogue(idx);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    next();
  }
});

continueEl.addEventListener('click', (e) => { e.stopPropagation(); next(); });
restartBtn.addEventListener('click', () => { idx = 0; friendship = 0; endScreen.style.display = 'none'; showDialogue(0); });
</script>
<audio id="bgm" loop></audio>
<audio id="textSfx" src="audio/se/SYS_text.ogg"></audio>
<script>
  const bgmEl = document.getElementById('bgm');
  let audioStarted = false;
  const BGM_LIST = [
    'audio/bgm/pyrefly_forest.ogg',
    'audio/bgm/event_maris_theme.ogg',
    'audio/bgm/bs_friend1.ogg'
  ];
  function startAudio() {
    if (audioStarted) return;
    audioStarted = true;
    const randomBgm = BGM_LIST[Math.floor(Math.random() * BGM_LIST.length)];
    bgmEl.src = randomBgm;
    bgmEl.volume = 0.4;
    bgmEl.play().catch(() => {});
  }
  document.addEventListener('click', startAudio);
  document.addEventListener('keydown', startAudio);

  showDialogue(0);
</script>
</body>
</html>
